[package]
name = "terrorbat"
version = "0.2.0"
edition = "2024"
description = "Terror Bat — reproducible falsification experiments with evidence and receipts"
license = "MIT OR Apache-2.0"
repository = "https://github.com/matthewjameswatkins1978-cyber/The-Terror-Bats"

[dependencies]
anstyle = "1.0"
clap = { version = "4.6", features = ["derive"] }
command-group = "5.0"
dirs = "7"
regex = "1"
sartorial-core = { git = "https://github.com/matthewjameswatkins1978-cyber/Sartorial", rev = "2bb70656a76ca5bec0976c66c7a1f032b0a59826" }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = "0.11"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
# Probe-only: ignoring SIGTERM in the graceful-termination test helper.
libc = "0.2"
