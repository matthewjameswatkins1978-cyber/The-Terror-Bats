[package]
name = "terrorbat"
version = "0.1.0"
edition = "2024"
description = "Terror Bat — falsification and assurance framework (M1: Bat Spec parsing and content identity)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/matthewjameswatkins1978-cyber/The-Terror-Bats"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = "0.11"
thiserror = "2"
