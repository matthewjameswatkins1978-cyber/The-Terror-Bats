# RC1 release packaging. Tag-triggered ONLY (v*); ordinary commits never
# package here. One Windows lane, one Linux lane, one aggregation job —
# no matrix explosion (see ACTIONS ECONOMY in the convergence packet).
#
# Linux target: x86_64-unknown-linux-gnu on ubuntu-22.04 (glibc baseline;
# musl deferred post-RC1 — one honest artifact over two ambiguous ones).

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --bin terrorbats
      - name: Install smoke
        shell: pwsh
        run: |
          $smoke = "$env:RUNNER_TEMP\tb-install"
          .\install\install.ps1 -InstallDir $smoke
          & "$smoke\terrorbats.exe" --version
      - name: Doctor smoke
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\tb-install\terrorbats.exe" doctor
      - name: Real Bat + replay smoke
        shell: pwsh
        run: |
          $bin = "$env:RUNNER_TEMP\tb-install\terrorbats.exe"
          $target = "$env:RUNNER_TEMP\tb-target"
          New-Item -ItemType Directory -Force $target | Out-Null
          git -C $target init -q
          git -C $target config user.email smoke@test.local
          git -C $target config user.name Smoke
          git -C $target commit -q --allow-empty -m smoke
          $store = "$env:RUNNER_TEMP\tb-store"
          $receipt = & $bin run bats/command-exit.yaml --repo $target --store $store --json | ConvertFrom-Json
          if ($receipt.verdict -ne 'NOT OBSERVED') { throw "unexpected verdict: $($receipt.verdict)" }
          & $bin replay $receipt.receipt_id --store $store | Out-Null
      - name: Package ZIP
        shell: pwsh
        run: |
          .\dist\pack-windows.ps1 -BuildWorkflow 'release/${{ github.ref_name }}'
      - name: Verify embedded icon
        shell: pwsh
        run: |
          pip install pefile
          python dist/verify-icon.py target/release/terrorbats.exe assets/brand/terrorbats.ico
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: |
            dist/*.zip
            dist/*.zip.sha256

  linux-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --bin terrorbats
      - name: Install smoke
        run: |
          ./install/install.sh --prefix "$RUNNER_TEMP/tb-root"
          "$RUNNER_TEMP/tb-root/bin/terrorbats" --version
      - name: Doctor smoke
        run: '"$RUNNER_TEMP/tb-root/bin/terrorbats" doctor'
      - name: Real Bat + replay smoke
        run: |
          BIN="$RUNNER_TEMP/tb-root/bin/terrorbats"
          TARGET="$RUNNER_TEMP/tb-target"
          mkdir -p "$TARGET"
          git -C "$TARGET" init -q
          git -C "$TARGET" config user.email smoke@test.local
          git -C "$TARGET" config user.name Smoke
          git -C "$TARGET" commit -q --allow-empty -m smoke
          STORE="$RUNNER_TEMP/tb-store"
          RECEIPT_JSON="$("$BIN" run bats/command-exit.yaml --repo "$TARGET" --store "$STORE" --json)"
          echo "$RECEIPT_JSON" | grep -q '"verdict": "NOT OBSERVED"'
          RID="$(echo "$RECEIPT_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["receipt_id"])')"
          "$BIN" replay "$RID" --store "$STORE" > /dev/null
      - name: Package tarball
        run: ./dist/pack-linux.sh --workflow 'release/${{ github.ref_name }}'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  aggregate:
    needs: [windows-release, linux-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - name: Combined checksums
        run: |
          cd bundles
          sha256sum terrorbats-*.zip terrorbats-*.tar.gz > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "bundles/terrorbats-*.zip, bundles/terrorbats-*.tar.gz"
      - name: Draft GitHub Release (pre-release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" \
            --draft --prerelease \
            --title "The Terror Bats Framework ${TAG#v}" \
            --notes "RC1 draft. Verify with: sha256sum -c SHA256SUMS.txt (Linux) or Get-FileHash -Algorithm SHA256 (Windows). Windows binary is not Authenticode-signed." \
            bundles/terrorbats-*.zip bundles/terrorbats-*.tar.gz bundles/SHA256SUMS.txt
