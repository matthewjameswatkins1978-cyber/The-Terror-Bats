name: Stateful process core

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --locked

  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - name: Linux bundle + release-path smoke (no tag)
        run: |
          cargo build --release --bin terrorbats
          bash dist/smoke-linux-bundle.sh --workflow 'pr/${{ github.event.pull_request.number || github.sha }}'
