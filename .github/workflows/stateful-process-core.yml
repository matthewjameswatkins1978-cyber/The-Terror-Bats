name: Stateful process core

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --locked

  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - name: Linux bundle + release-path smoke (no tag)
        run: |
          cargo build --release --bin terrorbats
          bash dist/smoke-linux-bundle.sh --workflow 'pr/${{ github.event.pull_request.number || github.sha }}'

  mcp-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run MCP bridge unit tests
        run: python -m unittest discover -s adapters/mcp/tests -v
      - name: Test packaging and wheel build
        run: |
          pip install --upgrade build pip
          python -m build adapters/mcp
