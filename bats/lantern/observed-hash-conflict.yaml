version: terrorbat/v1
id: lantern-observed-hash-conflict
claim:
  text: A stale observed hash produces conflict instead of a successful mutation.
requires: [process.spawn, fs.read, fs.write, git.inspect, network]
attack:
  run:
    - adapter: lantern
      action: bridge_contract
      scenario: observed_hash
oracle:
  any:
    - type: json_value_equals
      step: run:0
      pointer: /checks/violation
      value: true
evidence:
  capture: [stdout, stderr]
timeout:
  setup: 10s
  run: 120s
  total: 150s
meta:
  tags: [lantern, hostile, deterministic]
