version: terrorbat/v1
id: lantern-many-writer-same-key
claim:
  text: Sixteen equivalent simultaneous ledger writers converge to one reopened durable record without storage errors.
requires: [process.spawn, fs.read, fs.write, git.inspect, network]
attack:
  run:
    - adapter: lantern
      action: ledger_history
      scenario: race
      writers: 16
oracle:
  any:
    - type: json_value_equals
      step: run:0
      pointer: /checks/violation
      value: true
evidence:
  capture: [stdout, stderr]
timeout:
  setup: 10s
  run: 120s
  total: 150s
meta:
  tags: [lantern, hostile, deterministic]
