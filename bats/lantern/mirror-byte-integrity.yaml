version: terrorbat/v1
id: lantern-mirror-byte-integrity
claim:
  text: Exported record bytes sidecar Git blob and manifest status agree exactly.
requires: [process.spawn, fs.read, fs.write, git.inspect, network]
attack:
  run:
    - adapter: lantern
      action: mirror_probe
      scenario: normal
oracle:
