version: terrorbat/v1
id: lantern-rewritten-inbox-history
claim:
  text: The bridge rejects a non-descendant inbox head rather than continuing rewritten history.
requires: [process.spawn, fs.read, fs.write, git.inspect, network]
attack:
  run:
    - adapter: lantern
      action: bridge_contract
      scenario: rewritten_history
oracle:
  any:
    - type: json_value_equals
      step: run:0
      pointer: /checks/violation
      value: true
evidence:
  capture: [stdout, stderr]
timeout:
  setup: 10s
  run: 120s
  total: 150s
meta:
  tags: [lantern, hostile, deterministic]
