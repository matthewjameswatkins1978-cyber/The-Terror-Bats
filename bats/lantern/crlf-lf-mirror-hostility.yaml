version: terrorbat/v1
id: lantern-crlf-lf-mirror-hostility
claim:
  text: Mirror byte integrity survives Git checkout with core.autocrlf true.
requires: [process.spawn, fs.read, fs.write, git.inspect, network]
attack:
  run:
    - adapter: lantern
      action: mirror_probe
      scenario: crlf
oracle:
  any:
    - type: json_value_equals
      step: run:0
      pointer: /checks/violation
      value: true
evidence:
  capture: [stdout, stderr]
timeout:
  setup: 10s
  run: 120s
  total: 150s
meta:
  tags: [lantern, hostile, deterministic]
