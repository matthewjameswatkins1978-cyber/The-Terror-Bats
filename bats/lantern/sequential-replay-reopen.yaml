version: terrorbat/v1
id: lantern-sequential-replay-reopen
claim:
  text: Repeated equivalent ledger writes survive storage close/reopen as exactly one record.
requires: [process.spawn, fs.read, fs.write, git.inspect, network]
attack:
  run:
    - adapter: lantern
      action: ledger_history
      scenario: sequential
      writers: 4
oracle:
  any:
    - type: json_value_equals
      step: run:0
      pointer: /checks/violation
      value: true
evidence:
  capture: [stdout, stderr]
timeout:
  setup: 10s
  run: 120s
  total: 150s
meta:
  tags: [lantern, hostile, deterministic]
