{
  "version": "terrorbat/v1",
  "id": "threadmoth-transaction-rollback",
  "claim": {
    "text": "A transaction with a deterministically failing later member writes neither member during prepare or commit."
  },
  "requires": [
    "process.spawn",
    "fs.write",
    "git.inspect"
  ],
  "attack": {
    "setup": [
      {
        "adapter": "fs",
        "action": "write",
        "path": ".hostile-fixtures.py",
        "from": "../../adapters/threadmoth/fixtures.py"
      },
      {
        "adapter": "command",
        "action": "run",
        "program": {
          "$param": "python_program"
        },
        "args": [
          {
            "$param": "fixture_script"
          },
          "prepare",
          "transaction-rollback"
        ]
      }
    ],
    "run": [
      {
        "adapter": "threadmoth",
        "action": "transact_preview",
        "request_path": ".hostile/request.json",
        "output_path": ".hostile/first.json"
      },
      {
        "adapter": "threadmoth",
        "action": "transact",
        "request_path": ".hostile/request.json",
        "output_path": ".hostile/result.json"
      },
      {
        "adapter": "command",
        "action": "run",
        "program": {
          "$param": "python_program"
        },
        "args": [
          {
            "$param": "fixture_script"
          },
          "check",
          "transaction-rollback"
        ]
      }
    ]
  },
  "oracle": {
    "type": "json_value_equals",
    "step": "run:2",
    "pointer": "/violation",
    "value": true
  },
  "evidence": {
    "capture": [
      "stdout",
      "stderr",
      "git_diff"
    ]
  },
  "timeout": {
    "setup": "30s",
    "run": "90s",
    "total": "120s"
  },
  "params": {
    "python_program": {
      "type": "string",
      "default": "python"
    },
    "fixture_script": {
      "type": "string",
      "default": ".hostile-fixtures.py"
    }
  },
  "meta": {
    "tags": [
      "threadmoth",
      "hostile"
    ],
    "origin": "local"
  }
}
