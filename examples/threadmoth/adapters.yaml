# Threadmoth hostile-pack bindings (example — copy aside and fix the paths).
#
# Terror Bat resolves a `program` entry that contains a directory relative to
# THIS file, but `args` entries are passed through verbatim, and the adapter
# execute process runs with the disposable worktree as its cwd. So both paths
# below must be ABSOLUTE (or bare PATH names). Replace the tokens, then run:
#
#   terrorbat pack check packs/threadmoth-hostile.yaml
#   terrorbat pack run packs/threadmoth-hostile.yaml --repo <clean-target> \
#       --adapters <your-copy-of-this-file>
version: terrorbat-adapters/v1
adapters:
  threadmoth:
    program: python
    args:
      - <ABSOLUTE-PATH-TO-REPO>/adapters/threadmoth/adapter.py
      - --threadmoth
      - <ABSOLUTE-PATH-TO-THREADMOTH-1.10.0-EXE>
