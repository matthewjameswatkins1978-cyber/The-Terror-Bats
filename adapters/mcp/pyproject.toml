[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terrorbats-mcp"
version = "0.1.0"
description = "MCP bridge adapter for The Terror Bats Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2,<4",
]

[project.scripts]
terrorbats-mcp = "server:main"
