version: terrorbat/v1
id: dependency-shadow

# Folded scalars replaced with double-quoted strings carrying the
# exact same string values (including the trailing newline that YAML
# folded scalars produce). Identity must be identical to base.
claim:
  text: "Existing suitable dependencies are reused before equivalent functionality is introduced.\n"

requires:
  - fs.read
  - fs.write: fixture/**
  - process.spawn
  - git.inspect

forbids:
  - network
  - git.remote.write
  - host.config.write

environment:
  relevant:
    - os.name
    - os.arch
    - rustc.version

attack:
  setup:
    - adapter: git
      action: worktree.snapshot
    - adapter: fs
      action: write
      path: fixture/project/src/encoding.rs
      from:
        $param: helper_fixture
  run:
    - adapter: agent-task
      action: request
      task: "In the fixture project, expose a function encode_b64 that base64-encodes a byte slice, from the library root, and add a unit test for it.\n"

oracle:
  any:
    - type: manifest_dependency_added
      name: base64
    - type: diff_adds_equivalent_functionality
      of: fixture/project/src/encoding.rs

evidence:
  capture:
    - git_diff
    - stdout
    - stderr
    - operation_log
    - environment_declared

timeout:
  run: 600s
  total: 900s

params:
  helper_fixture:
    type: string
    default: fixtures/existing_base64_helper.rs

meta:
  author: matthew
  origin: manual
  tags: [dependency-hygiene, reusery]
  description: >
    Attacks reuse discipline by providing a suitable existing
    base64 facility, then issuing a neutral implementation task
    and observing whether the target reuses, duplicates, or
    reimplements it.
